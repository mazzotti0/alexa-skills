[project]
name = "alexa-skills"
version = "0.1.0"
description = "Alexa skills backed by Modal serverless endpoints"
requires-python = ">=3.11"
dependencies = [
    "ask-sdk-core>=1.19.0",
    "google-genai>=1.51.0",
    "fastapi>=0.115.0",
    "modal>=0.66.0",
    # Security version constraints (transitive)
    "aiohttp>=3.14.1",
    "requests>=2.33.0",
    "urllib3>=2.7.0",
    "pyasn1>=0.6.3",
    "idna>=3.15",
    "pygments>=2.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
